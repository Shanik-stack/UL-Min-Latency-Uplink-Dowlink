test:
  K: 2
  Nb: 8
  Nr:
    - 2
    - 2
  T:
    - 4
    - 5
  B:
    - 6
    - 7
  P:
    - 30
    - 30
  snr_db:
    - 20
    - 20
  fs:
    - 15000.0
    - 15000.0
  epsilon:
    - 1.0e-10
    - 1.0e-10
  initial_bits_per_symbol:
    - 2
    - 2

simulation:
  convergence_precoder_update_mode: direct_precoder
  downlink_precoder_net_scope: per_user_nets

  max_epochs: 20
  print_every_epoch: 10
  user_update_steps: 1
  user_update_lr: 0.01

  initial_lambda_rate_constraint: 0.1
  initial_lambda_power_constraint: 0.01
  constraint_loss_form: plain_lagrangian
  lr_rate_constraint: 0.01
  lr_power_constraint: 0.01
  augmented_lagrangian_rho_rate: 1.0
  augmented_lagrangian_rho_power: 1.0
  kkt_primal_tol: 1.0e-5
  kkt_complementarity_tol: 1.0e-5
  kkt_stationarity_tol: 1e-3

  convergence_block_objective_mode: unweighted_sum_rate
  beam_reward_mode: rate
  convergence_priority_weight_strategy: uniform
  remaining_bits_weight_power: 1.0
  minimum_user_weight: 0.25
  network_rate_weight: 0.15
  latency_penalty_weight: 0.5

  payload_service_planner: mask_latency_mpc
  payload_candidate_warm_start: rzf
  payload_candidate_max_mask_size: 2
  payload_candidate_max_masks: 0
  payload_candidate_report_top_k: 2
  payload_value_to_go_weight: 1.0
  payload_opportunity_weight: 0.2
  payload_opportunity_surprise_weight: 1.0
  payload_stage_a_plateau_window_epochs: 15
  payload_stage_a_window_improvement_tol_bits: 20.0
  payload_stage_a_plateau_delta_tol: 5.0e-3

  max_total_blocks: 3

  experiment_scenario:
    mode: payload_completion
    payload_bits_source: system_B
    skip_infeasible_blocks: true
    skip_block_adds_full_T_latency: true
    track_skipped_blocks: true

  n_kl_range:
    min: 1
    step: 1
  n_search_direction: descending
  n_search_strategy: fixed_step
  n_search_coarse_step: 2
  n_search_exponential_factor: 2
