test:
  K: 3
  Nb: 16
  Nr:
    - 4
    - 4
    - 4
  T:
    - 50
    - 60
    - 80
  B:
    - 1500
    - 3000
    - 4500
  P:
    - 30
    - 30
    - 30
  snr_db:
    - 8
    - 8
    - 8
  fs:
    - 15000.0
    - 15000.0
    - 15000.0
  epsilon:
    - 1.0e-12
    - 1.0e-12
    - 1.0e-12
  initial_bits_per_symbol:
    - 4
    - 4
    - 4

simulation:
  convergence_precoder_update_mode: direct_precoder
  downlink_precoder_net_scope: per_user_nets

  max_epochs: 120
  print_every_epoch: 5
  user_update_steps: 1
  user_update_lr: 0.001

  initial_lambda_rate_constraint: 0.1
  initial_lambda_power_constraint: 0.01
  constraint_loss_form: plain_lagrangian
  lr_rate_constraint: 0.01
  lr_power_constraint: 0.01
  augmented_lagrangian_rho_rate: 1.0
  augmented_lagrangian_rho_power: 1.0
  kkt_primal_tol: 1.0e-5
  kkt_complementarity_tol: 1.0e-5
  kkt_stationarity_tol: 1e-3

  n_kl_reduction_update_scope: infeasible_users_only

  monte_carlo_test_seed: 3
  monte_carlo_num_train_seeds: 3
  monte_carlo_training_max_epochs: 120
  monte_carlo_training_style: rollout_query_lagrangian
  monte_carlo_training_fallback_target_bits: 1
  monte_carlo_training_full_block_weight: 1.0
  monte_carlo_training_tail_feasible_weight: 1.0
  monte_carlo_training_tail_frontier_weight: 1.5
  monte_carlo_rollout_query_weighting_mode: uniform_per_query

  convergence_block_objective_mode: unweighted_sum_rate
  beam_reward_mode: rate
  convergence_priority_weight_strategy: inverse_cnr
  remaining_bits_weight_power: 1.0
  minimum_user_weight: 0.25
  network_rate_weight: 0.15
  latency_penalty_weight: 0.5

  payload_service_planner: latency_direct_block
  payload_candidate_warm_start: rzf
  payload_stage_a_reward_mode: useful_bits_plus_completion_bonus
  payload_stage_a_completion_bonus_bits: 256.0
  payload_stage_a_completion_transition_bits: 32.0
  payload_candidate_max_mask_size: 3
  payload_candidate_max_masks: 0
  payload_candidate_report_top_k: 3
  payload_value_to_go_weight: 1.0
  payload_opportunity_weight: 0.35
  payload_opportunity_surprise_weight: 1.0
  payload_latency_direct_max_rounds: 4
  payload_latency_direct_score_tol_seconds: 1.0e-4
  payload_candidate_max_epochs: 12
  payload_commit_max_epochs: 120
  payload_latency_direct_n_sample_step: 2
  payload_stage_a_plateau_window_epochs: 15
  payload_stage_a_window_improvement_tol_bits: 20.0
  payload_stage_a_plateau_delta_tol: 5.0e-3

  max_total_blocks: 256

  experiment_scenario:
    mode: payload_completion
    payload_bits_source: system_B
    skip_infeasible_blocks: true
    skip_block_adds_full_T_latency: true
    track_skipped_blocks: true

  n_kl_range:
    min: 1
    step: 1
  n_search_direction: descending
  n_search_strategy: fixed_step
  n_search_coarse_step: 2
  n_search_exponential_factor: 2
